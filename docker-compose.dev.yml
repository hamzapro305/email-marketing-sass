# ─────────────────────────────────────────────────────────────
# Dev override — convenience for local development.
#
# Publishes Mongo and Redis to the host so you can inspect them with local
# tools (Compass, redis-cli), and runs a single backend replica for simpler
# logs. Compose it on top of the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#   # or: make dev
# ─────────────────────────────────────────────────────────────

services:
  mongo:
    ports:
      - '${MONGO_PORT:-27017}:27017'

  redis:
    ports:
      - '${REDIS_PORT:-6379}:6379'

  backend:
    deploy:
      replicas: ${BACKEND_REPLICAS:-1}
