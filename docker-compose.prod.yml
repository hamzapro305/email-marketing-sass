# ─────────────────────────────────────────────────────────────
# Prod override — hardened for a server deploy.
#
# Keeps every internal service (mongo, redis, ai-service, api, worker) OFF the
# host network: the gateway is the only published port. Uses `restart: always`
# and the production replica counts from .env.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
#   # or: make prod
# ─────────────────────────────────────────────────────────────

services:
  mongo:
    restart: always

  redis:
    restart: always

  ai-service:
    restart: always

  api:
    restart: always
    deploy:
      replicas: ${API_REPLICAS:-2}

  worker:
    restart: always
    deploy:
      replicas: ${WORKER_REPLICAS:-3}

  gateway:
    restart: always
