# ─────────────────────────────────────────────────────────────
# Coolify deploy — single docker-compose, all env vars come from
# Coolify's project environment variables (no .env file needed).
#
# EXTERNAL SERVICES (need domains assigned in Coolify):
#   - gateway  (frontend SPA + /api proxy) → your FRONTEND_DOMAIN
#   - api      (NestJS REST)               → your BACKEND_DOMAIN
#
# INTERNAL SERVICES (docker network only, no public exposure):
#   - mongo, redis, ai-service, worker
#
# Required Coolify env vars — set these in your Coolify project:
#
#   FRONTEND_DOMAIN       e.g. app.example.com
#   BACKEND_DOMAIN        e.g. api.example.com
#   MONGO_USER            e.g. root
#   MONGO_PASSWORD        (strong random string)
#   ENCRYPTION_KEY        (long random string, never change after first deploy)
#   CORS_ORIGIN           e.g. https://app.example.com
#
# Optional:
#   API_REPLICAS          (default: 2)
#   WORKER_REPLICAS       (default: 3)
#   SEND_HOURLY_LIMIT     (default: 80)
#   PIPELINE_CONCURRENCY  (default: 5)
#   SEND_CONCURRENCY      (default: 25)
#   MAX_RIVALS            (default: 3)
#   SCRAPE_MAX_PAGES_PER_SITE  (default: 4)
#   SCRAPE_TIMEOUT_MS     (default: 10000)
#   SCRAPE_MIN_DOMAIN_DELAY_MS (default: 1500)
#   SCRAPE_CACHE_TTL_HOURS     (default: 168)
#   RESEARCH_CACHE_TTL_HOURS   (default: 168)
# ─────────────────────────────────────────────────────────────

x-backend-base: &backend-base
  build:
    context: ./backend
  restart: always
  environment: &backend-env
    NODE_ENV: production
    PORT: 3000
    MONGO_URI: mongodb://${MONGO_USER:-root}:${MONGO_PASSWORD}@mongo:27017/ems?authSource=admin
    REDIS_HOST: redis
    REDIS_PORT: 6379
    AI_SERVICE_URL: http://ai-service:8000
    PUBLIC_URL: https://${BACKEND_DOMAIN:-localhost}
    CORS_ORIGIN: ${CORS_ORIGIN:-https://${FRONTEND_DOMAIN}}
    ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    SEND_HOURLY_LIMIT: ${SEND_HOURLY_LIMIT:-80}
    PIPELINE_CONCURRENCY: ${PIPELINE_CONCURRENCY:-5}
    SEND_CONCURRENCY: ${SEND_CONCURRENCY:-25}
    MAX_RIVALS: ${MAX_RIVALS:-3}
    SCRAPE_MAX_PAGES_PER_SITE: ${SCRAPE_MAX_PAGES_PER_SITE:-4}
    SCRAPE_TIMEOUT_MS: ${SCRAPE_TIMEOUT_MS:-10000}
    SCRAPE_MIN_DOMAIN_DELAY_MS: ${SCRAPE_MIN_DOMAIN_DELAY_MS:-1500}
    SCRAPE_CACHE_TTL_HOURS: ${SCRAPE_CACHE_TTL_HOURS:-168}
    RESEARCH_CACHE_TTL_HOURS: ${RESEARCH_CACHE_TTL_HOURS:-168}
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 30s

services:
  # ── Internal: MongoDB ────────────────────────────────────────
  mongo:
    image: mongo:7
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: [ 'CMD', 'mongosh', '--quiet', '--eval', "db.runCommand('ping').ok" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Internal: Redis ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: always
    command: [ 'redis-server', '--appendonly', 'yes' ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Internal: AI service (Google ADK agents) ─────────────────
  ai-service:
    build:
      context: ./ai-service
    restart: always
    expose:
      - '8000'
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── External: API (HTTP) ─────────────────────────────────────
  api:
    <<: *backend-base
    environment:
      <<: *backend-env
      APP_ROLE: api
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - '3000'

  # ── Internal: Worker (queue consumers) ───────────────────────
  worker:
    <<: *backend-base
    environment:
      <<: *backend-env
      APP_ROLE: worker
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    expose:
      - '3000'

  # ── External: Gateway (nginx — SPA + /api proxy) ─────────────
  gateway:
    build:
      context: ./frontend
    restart: always
    depends_on:
      - api
    expose:
      - '80'
    healthcheck:
      test: [ 'CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:80/' ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo-data:
  redis-data:
