worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # Docker's embedded DNS. Re-resolving `backend` on every request is what lets
  # nginx round-robin across all backend replicas as they scale up/down.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Large lead files (10k rows) need a generous body limit.
  client_max_body_size 50m;

  # Basic access log with the upstream that served each request, so you can
  # literally watch traffic spread across the backend containers.
  log_format lb '$remote_addr -> $upstream_addr "$request" $status ${request_time}s';
  access_log /var/log/nginx/access.log lb;

  sendfile on;
  keepalive_timeout 65;

  server {
    listen 80;
    server_name _;

    location / {
      # Using a variable forces per-request DNS resolution (round-robin over
      # the replicas). Compose service name + internal port.
      set $backend "backend:3000";
      proxy_pass http://$backend;

      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Campaign start returns fast, but keep sane timeouts for uploads.
      proxy_connect_timeout 10s;
      proxy_read_timeout    120s;
      proxy_send_timeout    120s;
    }
  }
}
