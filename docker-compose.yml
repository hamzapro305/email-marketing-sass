# ─────────────────────────────────────────────────────────────
# Base stack — shared by every environment.
#
#   nginx (the ONLY published port)
#     └─> backend ×N replicas   (REST API + BullMQ workers)
#           ├─> mongo           (source of truth)
#           ├─> redis           (shared job queue → parallel sends)
#           └─> email-writer     (AI email sidecar)
#
# By itself this file publishes nothing but nginx — mongo, redis and the
# email-writer stay on the internal network. Compose in with an override for
# your environment:
#
#   Dev :  docker compose -f docker-compose.yml -f docker-compose.dev.yml  up
#   Prod:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up
#
# ...or just use the Makefile:  `make dev`  /  `make prod`.
#
# All tunables come from `.env` (the Makefile writes it from .env.dev/.env.prod).
# ─────────────────────────────────────────────────────────────

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-example}
    volumes:
      - mongo-data:/data/db
    # No published ports here — only reachable inside the compose network.
    # The dev override republishes 27017 for local tooling.
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    # Internal only — the dev override republishes 6379.
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Google ADK email-writing sidecar. Holds NO LLM credentials — the backend
  # sends the user's chosen provider/model/key per request. With no LLM on a
  # request it returns a local fallback email. `host.docker.internal` lets the
  # app reach an Ollama running on the host.
  email-writer:
    build:
      context: ./ai-writer
    restart: unless-stopped
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    expose:
      - '8000'
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      email-writer:
        condition: service_healthy
    # App-level config (ports, email mode, SMTP, CORS…) comes from .env.
    env_file:
      - ./.env
    # Network-internal wiring: inside the compose network the DB/queue/AI hosts
    # are the service names, so override the connection env here regardless of
    # what .env says (which is written for host-side `npm run` usage).
    environment:
      MONGO_URI: mongodb://${MONGO_USER:-root}:${MONGO_PASSWORD:-example}@mongo:27017/ems?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_WRITER_URL: http://email-writer:8000
    # No published ports — traffic only reaches the backend through nginx.
    expose:
      - '3000'
    deploy:
      replicas: ${BACKEND_REPLICAS:-3}

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    # The single public entry point. Host port comes from .env (NGINX_PORT).
    ports:
      - '${NGINX_PORT:-3000}:80'

volumes:
  mongo-data:
  redis-data:
