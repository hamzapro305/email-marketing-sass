# One-command dev environment: MongoDB + NestJS backend.
# The desktop frontend runs on the host and points at http://localhost:3000.
#
#   docker compose up --build      # start everything
#   docker compose down            # stop
#   docker compose down -v         # stop + wipe the database (fresh demo)

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongo-data:/data/db
    ports:
      - '27017:27017'
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - ./backend/.env
    ports:
      - '3000:3000'

volumes:
  mongo-data:
