# ─────────────────────────────────────────────────────────────
# Base stack — shared by every environment.
#
#   gateway  (nginx: serves the React SPA + proxies /api — the ONLY published port)
#     └─> api ×N        (NestJS, APP_ROLE=api — HTTP only, enqueues work)
#           ├─> mongo   (source of truth: leads, audits, campaigns, caches)
#           ├─> redis   (BullMQ queues + cross-replica coordination)
#           └─> ai-service (Google ADK agents: research/rivals/analysis/email)
#   worker ×N           (same image, APP_ROLE=worker — runs the audit pipeline
#                        + send queues; scale THIS for throughput)
#
# Compose in an override for your environment:
#   Dev :  docker compose -f docker-compose.yml -f docker-compose.dev.yml  up
#   Prod:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up
# ...or just use the Makefile:  `make dev`  /  `make prod`.
#
# All tunables come from `.env` (the Makefile writes it from .env.dev/.env.prod).
# ─────────────────────────────────────────────────────────────

x-backend-base: &backend-base
  build:
    context: ./backend
  restart: unless-stopped
  env_file:
    - ./.env
  # Network-internal wiring: inside the compose network the DB/queue/AI hosts
  # are the service names, so override the connection env here regardless of
  # what .env says (which is written for host-side `npm run` usage).
  environment: &backend-env
    MONGO_URI: mongodb://${MONGO_USER:-root}:${MONGO_PASSWORD:-example}@mongo:27017/ems?authSource=admin
    REDIS_HOST: redis
    REDIS_PORT: 6379
    AI_SERVICE_URL: http://ai-service:8000
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 30s

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-example}
    volumes:
      - mongo-data:/data/db
    # No published ports here — only reachable inside the compose network.
    # The dev override republishes 27017 for local tooling.
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    # Internal only — the dev override republishes 6379.
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Google ADK agents (research / rivals / analysis / email). Holds NO LLM
  # credentials — the backend forwards the user's configured provider/model/key
  # per request; with none it returns deterministic fallbacks.
  ai-service:
    build:
      context: ./ai-service
    restart: unless-stopped
    extra_hosts:
      - 'host.docker.internal:host-gateway' # lets it reach an Ollama on the host
    expose:
      - '8000'
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # HTTP-only backend: serves the REST API, enqueues pipeline/send jobs.
  api:
    <<: *backend-base
    environment:
      <<: *backend-env
      APP_ROLE: api
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - '3000'
    deploy:
      replicas: ${API_REPLICAS:-2}

  # Queue consumers: audit pipeline (research/scrape/analyze/email) + sending.
  # Scale THIS service for throughput — it does the heavy lifting.
  worker:
    <<: *backend-base
    environment:
      <<: *backend-env
      APP_ROLE: worker
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    expose:
      - '3000' # health endpoint only — no external traffic is routed here
    deploy:
      replicas: ${WORKER_REPLICAS:-3}

  # The single public entry point: static SPA + /api reverse proxy.
  gateway:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${GATEWAY_PORT:-3000}:80'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:80/']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo-data:
  redis-data:
