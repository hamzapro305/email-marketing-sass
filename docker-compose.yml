# Dev infrastructure.
#
# Common workflow (run the app yourself, DB in Docker):
#   docker compose up -d mongo     # start ONLY MongoDB (exposed on :27017)
#   # then run backend + frontend from your own terminal
#
# Full stack in Docker (optional, needs no Node on host):
#   docker compose up --build      # start Mongo + backend
#   docker compose down            # stop
#   docker compose down -v         # stop + wipe the database (fresh demo)

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongo-data:/data/db
    ports:
      - '27017:27017'
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - ./backend/.env
    # Inside the compose network the DB host is the `mongo` service, so we
    # override MONGO_URI here. This keeps `.env` free to use `localhost` for
    # running the backend directly on the host.
    environment:
      MONGO_URI: mongodb://root:example@mongo:27017/ems?authSource=admin
    ports:
      - '3000:3000'

volumes:
  mongo-data:
