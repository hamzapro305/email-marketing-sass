worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  resolver 127.0.0.11 valid=10s ipv6=off;

  # Large lead files (10k+ rows) need a generous body limit.
  client_max_body_size 50m;

  # Access log with the upstream that served each request, so traffic
  # spreading across the API containers is visible.
  log_format lb '$remote_addr -> $upstream_addr "$request" $status ${request_time}s';
  access_log /var/log/nginx/access.log lb;

  sendfile on;
  keepalive_timeout 65;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  server {
    listen 80;
    server_name _;

    # Basic security headers for the SPA.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ── API gateway ─────────────────────────────────────────
    location /api/ {
      set $api "api:3000";
      proxy_pass http://$api;

      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_connect_timeout 10s;
      proxy_read_timeout    120s;
      proxy_send_timeout    120s;
    }

    # ── Static SPA ──────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets are immutable — cache hard.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # Everything else falls back to the SPA shell (client-side routing).
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
